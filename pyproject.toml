[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-analyzer"
version = "0.1.0"
description = "Traceable focal spot analysis prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "Pillow==12.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["spot_analyzer*"]
